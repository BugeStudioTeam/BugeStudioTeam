name: Update Readme Stars

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Stars and Update README
        run: |
          python3 -c "
          import urllib.request
          import json

          def get_stars(repo):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  return str(data.get('stargazers_count', 0))

          buge_stars = get_stars('BugeStudioTeam/Buge-App-Manager')
          zynox_stars = get_stars('BugeStudioTeam/Zynox')

          with open('README.md', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              if 'Buge-App-Manager' in line and '|' in line:
                  parts = line.split('|')
                  parts[2] = f' {buge_stars} '
                  line = '|'.join(parts)
              elif 'Zynox' in line and '|' in line:
                  parts = line.split('|')
                  parts[2] = f' {zynox_stars} '
                  line = '|'.join(parts)
              new_lines.append(line)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.writelines(new_lines)
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update stars count in README" && git push)
