name: Update Readme Stars

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Stars and Update README
        run: |
          BUGE_STARS=$(curl -s https://api.github.com/repos/BugeStudioTeam/Buge-App-Manager | jq '.stargazers_count')
          ZYNOX_STARS=$(curl -s https://api.github.com/repos/BugeStudioTeam/Zynox | jq '.stargazers_count')

          sed -i -E "s/()[^<]*()/\1$BUGE_STARS\2/g" README.md
          sed -i -E "s/()[^<]*()/\1$ZYNOX_STARS\2/g" README.md

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update stars count in README" && git push)