name: Update Readme Stars

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Stars and Update README
        run: |
          python3 -c "
          import urllib.request
          import json
          import re

          def get_stars(repo):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  return data.get('stargazers_count', 0)

          buge_stars = get_stars('BugeStudioTeam/Buge-App-Manager')
          zynox_stars = get_stars('BugeStudioTeam/Zynox')

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          content = re.sub(r'.*?', f'{buge_stars}', content)
          content = re.sub(r'.*?', f'{zynox_stars}', content)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update stars count in README" && git push)
