name: Update Readme Stars

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stars
  cancel-in-progress: true

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Stars and Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import json
          import urllib.request
          import urllib.error

          TOKEN = os.environ.get("GITHUB_TOKEN", "")

          REPOS = {
              "Buge-App-Manager": "BugeStudioTeam/Buge-App-Manager",
              "Buge-Files":       "BugeStudioTeam/Buge-Files",
              "Buge-Player":      "BugeStudioTeam/Buge-Player",
              "Buge-Calculator":  "BugeStudioTeam/Buge-Calculator",
              "Buge-Store":       "BugeStudioTeam/Buge-Store",
              "Zynox":            "BugeStudioTeam/Zynox",
          }

          def get_stars(slug):
              url = f"https://api.github.com/repos/{slug}"
              headers = {
                  "User-Agent": "BugeStudioTeam-stars-updater",
                  "Accept": "application/vnd.github+json",
              }
              if TOKEN:
                  headers["Authorization"] = f"Bearer {TOKEN}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.loads(resp.read().decode())
                      return str(data.get("stargazers_count", 0))
              except urllib.error.HTTPError as e:
                  print(f"HTTP error for {slug}: {e.code} {e.reason}")
                  return None
              except Exception as e:
                  print(f"Error for {slug}: {e}")
                  return None

          stars = {name: get_stars(slug) for name, slug in REPOS.items()}
          print("Fetched stars:", stars)

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(
              r"^(\|\s*\[[^\]]*\]\(https://github\.com/BugeStudioTeam/"
              r"(?P<repo>Buge-App-Manager|Buge-Files|Buge-Player|Buge-Calculator|Buge-Store|Zynox)"
              r"\)\s*\|\s*)"
              r"(?P<stars>\d+)"
              r"(\s*\|.*)$",
              re.MULTILINE,
          )

          def repl(m):
              repo = m.group("repo")
              value = stars.get(repo)
              if value is None:
                  return m.group(0)
              return f"{m.group(1)}{value}{m.group(4)}"

          new_content, count = pattern.subn(repl, content)
          print(f"Updated {count} row(s).")

          if new_content != content:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("README written.")
          else:
              print("No changes needed.")
          EOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update stars count in README"
            git push
          fi